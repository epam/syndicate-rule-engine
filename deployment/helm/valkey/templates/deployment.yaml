apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valkey.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "valkey.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "valkey.chart" . }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
    {{- end}}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "valkey.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "valkey.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ include "valkey.chart" . }}
    spec:
      volumes:
        - name: valkey-storage
          persistentVolumeClaim:
            claimName: {{ include "valkey.persistenceName" . }}
      containers:
        - name: valkey
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              memory: "{{ .Values.memoryRequest }}"
            limits:
              memory: "{{ .Values.memoryLimit }}"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: password
                  optional: true
            # Deprecated upgrade fallback for releases that still have redis-secret.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
                  optional: true
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              EFFECTIVE_PASSWORD="${VALKEY_PASSWORD-${REDIS_PASSWORD-}}"
              if [ -n "${EFFECTIVE_PASSWORD}" ]; then
                exec valkey-server --save 20 1 --loglevel warning --requirepass "${EFFECTIVE_PASSWORD}"
              else
                exec valkey-server --save 20 1 --loglevel warning
              fi
          ports:
            - containerPort: 6379
              name: valkey-socket
              protocol: TCP
          volumeMounts:
            - name: valkey-storage
              mountPath: "/data"
      restartPolicy: Always
