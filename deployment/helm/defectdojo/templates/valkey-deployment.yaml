apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "defectdojo.fullname" . }}-valkey
  labels:
    app.kubernetes.io/name: {{ include "defectdojo.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "defectdojo.chart" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "defectdojo.name" . }}-valkey
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "defectdojo.name" . }}-valkey
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ include "defectdojo.chart" . }}
    spec:
      containers:
        - image: "{{ .Values.valkeyImage }}:{{ .Values.valkeyTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "64Mi"
          name: valkey
          ports:
            - containerPort: 6379
          volumeMounts:
            - mountPath: /data
              name: dd-valkey-pvc
      restartPolicy: Always
      volumes:
        - name: dd-redis-pvc
          persistentVolumeClaim:
            claimName: {{ include "defectdojo.fullname" . }}-cache

