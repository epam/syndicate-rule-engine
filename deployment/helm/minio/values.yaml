memoryLimit: 768Mi
memoryRequest: 128Mi

service:
  type: ClusterIP
  port: 9000
  nodePort: 32102


consoleService:
  type: ClusterIP
  port: 9001
  nodePort: 32103

console:
  enabled: false

# previous quay.io/minio/minio:RELEASE.2025-05-24T17-08-30Z (unsupported, no longer available on quay.io)
image:
  repository: public.ecr.aws/x4s4z8e1/syndicate/minio
  tag: RELEASE.2025-10-15T17-29-55Z
  pullPolicy: IfNotPresent

persistence:
  accessMode: ReadWriteOnce
  size: 4Gi
  storageClass: standard
  hostPath: /data/minio

replicas: 1
strategy:
  type: Recreate
  maxUnavailable: 0
  maxSurge: 100%
