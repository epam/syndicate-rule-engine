[project]
name = "syndicate-rule-engine"
description = "Service that allows to perform security scans on your infrastructure"
readme = "README.md"
requires-python = ">=3.14,<4"
license = {file = "LICENSE"}
version = "5.19.0"
dependencies = [
    # TODO: point py314
    "aws-xray-sdk~=2.15.0",
    "bcrypt>=4,<6",
    "boto3>=1.42,<2",
    "botocore>=1.42,<2",
    "bottle>=0.13,<0.15",
    "cachetools>=6,<8",
    "celery>=5.4,<6",
    "cryptography>=45,<50",
    "google-api-python-client>=2.188,<3",
    "google-auth>=2.47,<3",
    "gunicorn>=23,<27",
    "hvac>=2.3,<3",
    "jwcrypto>=1.5.6,<2",
    "modular-sdk>=8,<9",
    "msgspec>=0.18,<0.23",
    "openpyxl>=3,<4",
    "pydantic>=2.8,<3",
    "pymongo~=4.11.2",
    "pynamodb==6.1.0",
    "python-dateutil>=2.9,<3",
    # TODO: point py314
    "pytz-deprecation-shim~=0.1.0.post0",
    "redis~=5.2.1",
    "requests>=2.32,<3",
    "ruamel-yaml>=0.18,<0.21",
    "ruamel-yaml-clib>=0.2.12,<0.3",
    "tabulate>=0.9,<0.12",
    "typing-extensions>=4.13,<5",
    "xlsxwriter>=3.2.0,<4",
    "billiard>=4.2.4,<5",
]

[dependency-groups]
lint = [
    "mypy>=1.19.1",
]
test = [
    "coverage>=7.6.12",
    "mongomock>=4.3.0",
    "moto>=5.1.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "webtest>=3.0.4",
]
c7n = [
    "c7n==0.9.51",
    "c7n-azure==0.7.50",
    "c7n-gcp==0.4.50",
    "c7n-kube==0.2.50",
]
event-sources-consumer = [
    "kubernetes>=35,<36",
]


[tool.pyright]
pythonVersion = "3.14"
reportIncompatibleMethodOverride = "warning"
executionEnvironments = [
    {root = "src/", pythonVersion = "3.14"},
    {root = "tests/", pythonVersion = "3.14", extraPaths = ["src/"]},
    {root = "cli/", pythonVersion = "3.14", extraPaths = ["cli/", "src/"]}
]


[tool.ruff]
line-length = 79
src = ["src", "tests", "cli"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"


[tool.pytest.ini_options]
pythonpath = ["src", "cli"]
testpaths = ["tests"]


[tool.uv]
package = false
prerelease = "allow"  # for some azure lib
