[project]
name = "syndicate-rule-engine"
description = "Service that allows to perform security scans on your infrastructure"
readme = "README.md"
requires-python = ">=3.14,<4"
license = {file = "LICENSE"}
version = "5.21.0"
dependencies = [
    "bcrypt>=4,<6",
    "billiard~=4.2.4",
    "boto3~=1.43.3",
    "botocore~=1.43.3",
    "bottle~=0.13.4",
    "cachetools~=7.1.4",
    "celery~=5.6.3",
    "cryptography~=46.0.7",
    "google-api-python-client~=2.194.0",
    "google-auth~=2.49.2",
    "gunicorn~=26.0.0",
    "hvac>=2.3,<3",
    "jwcrypto>=1.5.6,<2",
    "modular-sdk~=8.0.0",
    "msgspec~=0.21.1",
    "openpyxl>=3,<4",
    "pydantic~=2.13.4",
    "pymongo~=4.11.2",
    "pynamodb==6.1.0",
    "python-dateutil~=2.9.0.post0",
    # Kombu's Redis transport imports redis-py when the server is Valkey.
    "redis~=5.2.1",
    "requests~=2.33.1",
    "ruamel-yaml>=0.18,<0.21",
    "ruamel-yaml-clib>=0.2.12,<0.3",
    "tabulate~=0.10.0",
    "typing-extensions>=4.13,<5",
    "valkey~=6.1.1",
    "xlsxwriter>=3.2,<4",
]

[dependency-groups]
lint = [
    "mypy>=1.19.1",
    "ruff>=0.9.0",
]
test = [
    "coverage>=7.6.12",
    "mongomock>=4.3.0",
    "moto>=5.1.1",
    "pydantic-settings>=2.6.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "webtest>=3.0.4",
]
c7n = [
    "c7n==0.9.51",
    "c7n-azure==0.7.50",
    "c7n-gcp==0.4.50",
    "c7n-kube==0.2.50",
]
event-sources-consumer = [
    "kubernetes>=35,<36",
]


[tool.pyright]
pythonVersion = "3.14"
reportIncompatibleMethodOverride = "warning"
executionEnvironments = [
    {root = "src/", pythonVersion = "3.14"},
    {root = "tests/", pythonVersion = "3.14", extraPaths = ["src/"]},
    {root = "tests/smoke/", pythonVersion = "3.14", extraPaths = ["tests/"]},
    {root = "cli/", pythonVersion = "3.14", extraPaths = ["cli/", "src/"]}
]


[tool.ruff]
line-length = 79
src = ["src", "tests", "cli"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"


[tool.pytest.ini_options]
pythonpath = ["src", "cli"]
testpaths = ["tests"]


[tool.uv]
package = false
prerelease = "allow"  # for some azure lib
